<app-header [notLoggedIn]="true"></app-header>

<main>

    <section class="container-forgot-password">
        <div class="container-form-forgot-password">
            <div class="container-stages">

                <div class="stage-1">
                    <div class="bar-pink"></div>
                    <span>E-mail</span>
                </div>
                <div class="stage-1">
                    <div class="bar-pink"></div>
                    <span>Código</span>
                </div>
                <div class="stage-1">
                    <div class="bar-pink"></div>
                    <span>Nova senha</span>
                </div>

            </div>

            <h1>Esqueceu sua senha ?</h1>
            <p>Vamos enviar um código de 6 dígitos para seu email cadastrado.</p>

            <form action="">

                <div class="container-form">

                    <div class="input-group">
                        <input type="email" placeholder="seu@email.com">
                    </div>

                    <div class="container-button-pink" (click)="sendCode()">
                        <span>
                            Enviar código
                        </span>
                    </div>
                    
                </div>
          
            </form>
        </div>
    </section>

</main>

<app-footer></app-footer>

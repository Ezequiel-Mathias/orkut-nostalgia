<app-header [notLoggedIn]="true"></app-header>

<main>

    <section class="section-share-thoughts">

        <div class="container-share-thoughts">

            <div class="share-thoughts">
                <h1>No que você está pensando, Ezequiel?</h1>
                <p>Só texto por aqui — pensamentos, recados e ideias soltas.</p>

                <div class="container-input-share-thoughts">
                    <div class="input-group">
                        <textarea type="text" placeholder="Escreva um pensamento..."></textarea>
                    </div>
                </div>

                <div class="container-button-share-thoughts">
                    <span>0/280</span>
                    <div class="container-button-pink">
                        Publicar
                    </div>
                </div>
            </div>

            <span class="title-recent-thoughts">PENSAMENTOS RECENTES</span>

            <div class="container-card-thoughts">
                <div class="container-personal-data">
                    <div class="face">

                    </div>
                    <div class="data">
                        <span>Ezequiel</span>
                        <span>Jandira-SP</span>
                    </div>
                </div>
            </div>

        </div>


        <div class="profile-information">
            <div class="container-personal-data">
                <span class="name">Ezequiel Mathias</span>
                <span class="location">Jandira-SP</span>
            </div>

            <div class="container-profile-picture">
                <span class="title">Amigos</span>
                <span class="number">2.410</span>
            </div>

            <div class="container-profile-picture">
                <span class="title">Recados</span>
                <span class="number">818</span>
            </div>

            <div class="container-translucent-button-small">
                <span>Ver meu perfil</span>
            </div>
        </div>

    </section>

    <section class="section-recent-thoughts">



    </section>

</main>
